<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087249"><title>Brote de Bambú | Catálogo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f8f3;color:#17211b}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #dce6d9;padding:12px;z-index:3}.nav{max-width:1150px;margin:auto;display:flex;gap:12px;align-items:center}.brand{font-weight:900;color:#087249;font-size:20px}input{flex:1;padding:12px;border:1px solid #c8d5c8;border-radius:12px;font-size:16px}.hero{max-width:1150px;margin:20px auto;padding:30px 20px;border-radius:22px;background:linear-gradient(135deg,#087249,#4a9a65);color:#fff}.hero h1{margin:0 0 8px;font-size:clamp(30px,6vw,58px)}.cats{max-width:1150px;margin:0 auto 16px;padding:0 12px;display:flex;gap:8px;overflow:auto}.cat{white-space:nowrap;border:1px solid #d7e2d5;background:#fff;padding:8px 12px;border-radius:999px;cursor:pointer}.cat.on{background:#087249;color:#fff}.wrap{max-width:1150px;margin:auto;padding:0 12px 40px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 16px}.meta{color:#667266}.sort{border:1px solid #c8d5c8;background:#fff;color:#26362c;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700;max-width:220px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #dde5db;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}.pic{aspect-ratio:4/3;background:#dff0ca;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:13px;display:flex;flex-direction:column;gap:7px;flex:1}.tag{font-size:11px;color:#087249;font-weight:700}.title{font-weight:800;font-size:15px;line-height:1.25}.desc{font-size:12.5px;line-height:1.4;color:#566159;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:52px}.price{font-weight:900;color:#087249;font-size:20px}.sub{font-size:11px;color:#6d786f;min-height:25px}.btn{margin-top:auto;border:0;border-radius:10px;padding:10px;background:#087249;color:#fff;font-weight:800;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:18px;align-items:center;justify-content:center}.modal.on{display:flex}.box{background:#fff;border-radius:18px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px;position:relative}.x{position:absolute;right:12px;top:12px;border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;z-index:2}.big{width:100%;max-height:330px;object-fit:contain;background:#eef7df;border-radius:14px;margin-bottom:14px}.features{padding-left:20px;line-height:1.45;color:#3e4b42}.wa{display:block;text-align:center;background:#25D366;color:#fff;text-decoration:none;padding:12px;border-radius:12px;font-weight:900;margin-top:14px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.toolbar{align-items:stretch;flex-direction:column}.sort{max-width:none;width:100%}.nav{flex-wrap:wrap}.brand{width:100%}.grid{grid-template-columns:repeat(2,1fr)}.hero{margin:14px 12px}}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><div class="brand">🐼 BROTE DE BAMBÚ</div><input id="q" placeholder="Buscar producto o característica…"></div></header><section class="hero"><h1>Catálogo Brote de Bambú</h1><p>Explora 109 productos con fotos, descripción, precios y características.</p></section><div class="cats" id="cats"></div><main class="wrap"><div class="toolbar"><div class="meta" id="n"></div><select class="sort" id="sort" aria-label="Ordenar productos"><option value="default">Orden original</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select></div><div class="grid" id="g"></div></main><div class="modal" id="mo" <script>const P=window.PRODUCTS||[],I=window.IMGS||{};let cat='Todos',q='',sort='default';const g=document.getElementById('g'),n=document.getElementById('n'),mo=document.getElementById('mo'),mc=document.getElementById('mc');function e(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return v?'S/'+v:'Consultar'}function img(x,cls=''){return I[x.i]?`<img class="${cls}" src="${I[x.i]}" alt="${e(x.t)}" loading="lazy">`:''}function cats(){const a=['Todos',...new Set(P.map(x=>x.c))],c=document.getElementById('cats');c.innerHTML=a.map((x,i)=>`<button class="cat ${i?'':'on'}" data-c="${e(x)}">${e(x)}</button>`).join('');c.onclick=ev=>{const b=ev.target.closest('.cat');if(!b)return;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.c;r()}}function filt(){return P.filter(x=>{const h=[x.t,x.c,x.d,...x.f].join(' ').toLowerCase();return(cat==='Todos'||x.c===cat)&&h.includes(q)})}function r(){let a=filt();if(sort==='asc')a=[...a].sort((x,y)=>(parseFloat(x.p)||Infinity)-(parseFloat(y.p)||Infinity));if(sort==='desc')a=[...a].sort((x,y)=>(parseFloat(y.p)||-Infinity)-(parseFloat(x.p)||-Infinity));n.textContent=`${a.length} productos`;g.innerHTML=a.map(x=>`<article class="card"><div class="pic">${img(x)}</div><div class="body"><div class="tag">${e(x.c)} · pág. ${x.i}</div><div class="title">${e(x.t)}</div><div class="desc">${e(x.d)}</div><div class="price">${money(x.p)}</div><div class="sub">${x.w?'Mayor/Doc: '+money(x.w):''}${x.b?' · Cajón: '+money(x.b):''}</div><button class="btn" onclick="openP(${x.i})">Ver detalles</button></div></article>`).join('')||'<p>No se encontraron productos.</p>'}window.openP=i=>{const x=P.find(y=>y.i===i);mc.innerHTML=`<button class="x" onclick="closeP()">×</button>${img(x,'big')}<div class="tag">${e(x.c)} · Página ${x.i} del catálogo</div><h2>${e(x.t)}</h2><p>${e(x.d)}</p><div class="price">${money(x.p)}</div><p class="sub">${x.w?'Precio mayor/docena: '+money(x.w)+'<br>':''}${x.b?'Precio por cajón: '+money(x.b):''}</p><h3>Características</h3><ul class="features">${x.f.map(z=>`<li>${e(z)}</li>`).join('')}</ul><a class="wa" href="#" onclick="alert('Falta configurar el número de WhatsApp de Brote de Bambú.');return false">Consultar por WhatsApp</a>`;mo.classList.add('on')};window.closeP=()=>mo.classList.remove('on');mo.onclick=ev=>{if(ev.target===mo)closeP()};document.getElementById('q').oninput=ev=>{q=ev.target.value.trim().toLowerCase();r()};document.getElementById('sort').onchange=ev=>{sort=ev.target.value;r()};cats();r();</script></body></html>
